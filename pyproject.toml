[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-reviewer"
version = "0.1.0"
description = "AI-powered code review agent using the Groq API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.12.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "GitPython>=3.1.0",
    "PyGithub>=2.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ai-code-review = "main:main"

[tool.setuptools]
packages = ["reviewer"]
py-modules = ["main"]
